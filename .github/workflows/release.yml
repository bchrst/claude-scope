name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml and CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "$package_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version, $package_version"
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version - <date>' entry"
            exit 1
          fi
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt -- --check

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../claude-scope-${{ matrix.target }}.tar.gz claude-scope
      - uses: actions/upload-artifact@v4
        with:
          name: claude-scope-${{ matrix.target }}
          path: claude-scope-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: claude-scope-*.tar.gz
          generate_release_notes: true
