[package]
name = "claude-scope"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Claude Code conversation archive tool with SQLite + FTS5"
license = "MIT"
repository = "https://github.com/bchrst/claude-scope"
homepage = "https://github.com/bchrst/claude-scope"
keywords = ["claude-code", "sqlite", "fts5", "archive", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
crossterm = "0.29"
unicode-width = "0.2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
